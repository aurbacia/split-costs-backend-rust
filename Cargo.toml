[package]
name = "split-costs-rust-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.3", features = ["default"] }
axum-macros = "0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.2", features = ["full"] }
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
diesel = { version = "2.2.0", features = ["postgres", "time", "serde_json"] }
dotenvy = "0.15"
time = { version = "0.3.41", features = ["serde"] }
argon2 = { version = "0.5.3", features = ["default", "std"] }
async-trait = "0.1.88"
deadpool = "0.12.2"
deadpool-diesel = { version = "0.6.1", features = ["postgres"] }
serial_test = "3.2.0"
rand_core = { version = "0.9.3", features = ["os_rng", "std"] }
getrandom = "0.3.2"
axum-test = "17.3.0"
nanoid = "0.4.0"
fakeit = "1.3.0"
validator = { version = "0.20.0", features = ["derive"] }
thiserror = "2.0.12"
paste = "1.0.15"
jsonwebtoken = "9.3.1"
axum-extra = {version = "0.10.1", features = ["cookie", "typed-header"]}
